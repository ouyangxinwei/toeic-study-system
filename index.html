<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC错题学习系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>📚 TOEIC错题学习系统</h1>
            <p>15套模拟题 · 200题/套 · 错题整理与复习</p>
            <button id="logoutBtn" class="auth-logout-btn" type="button" hidden>退出登录</button>
        </header>

        <!-- 搜索和筛选区域 -->
        <section class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="输入关键词搜索（标题、选项、答案、笔记）">
                <button id="searchBtn">搜索</button>
            </div>
            <div class="filter-box">
                <select id="partFilter">
                    <option value="">全部Part</option>
                    <option value="1">Part 1 - 照片描述</option>
                    <option value="2">Part 2 - 问答应答</option>
                    <option value="3">Part 3 - 短对话</option>
                    <option value="4">Part 4 - 独白/短文</option>
                    <option value="5">Part 5 - 句子填空</option>
                    <option value="6">Part 6 - 段落填空</option>
                    <option value="7">Part 7 - 阅读理解</option>
                </select>
                <select id="statusFilter">
                    <option value="">全部状态</option>
                    <option value="wrong">错题</option>
                    <option value="reviewed">已复习</option>
                    <option value="correct">答对</option>
                </select>
            </div>
            <div class="add-question-section">
                <button id="addQuestionBtn" class="add-btn" type="button">＋ 录入新题（题干 / A-D选项 / 正确答案）</button>
            </div>
        </section>

<!-- 录入表单弹窗 -->
<div id="addQuestionModal" class="modal">
    <div class="modal-content modal-large">
        <span class="close" id="closeAddModal">&times;</span>
        <h2>录入新题</h2>
        
        <form id="addQuestionForm">
            <div class="form-group">
                <label>套题编号 *</label>
                <select id="formSetId" required>
                    <option value="1">第1套</option>
                    <option value="2">第2套</option>
                    <option value="3">第3套</option>
                    <option value="4">第4套</option>
                    <option value="5">第5套</option>
                    <option value="6">第6套</option>
                    <option value="7">第7套</option>
                    <option value="8">第8套</option>
                    <option value="9">第9套</option>
                    <option value="10">第10套</option>
                    <option value="11">第11套</option>
                    <option value="12">第12套</option>
                    <option value="13">第13套</option>
                    <option value="14">第14套</option>
                    <option value="15">第15套</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Part *</label>
                <select id="formPartId" required>
                    <option value="1">Part 1 - 照片描述</option>
                    <option value="2">Part 2 - 问答应答</option>
                    <option value="3">Part 3 - 短对话</option>
                    <option value="4">Part 4 - 独白/短文</option>
                    <option value="5">Part 5 - 句子填空</option>
                    <option value="6">Part 6 - 段落填空</option>
                    <option value="7">Part 7 - 阅读理解</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>题号 *</label>
                <input type="text" id="formQuestionId" placeholder="例如：1-1-003" required>
            </div>
            
            <div class="form-group">
                <label>题目标题/题干 *</label>
                <textarea id="formTitle" rows="4" required></textarea>
            </div>
            
            <div class="form-group">
                <label>选项 A *</label>
                <input type="text" id="formOptionA" required>
            </div>
            
            <div class="form-group">
                <label>选项 B *</label>
                <input type="text" id="formOptionB" required>
            </div>
            
            <div class="form-group">
                <label>选项 C *</label>
                <input type="text" id="formOptionC" required>
            </div>
            
            <div class="form-group">
                <label>选项 D *</label>
                <input type="text" id="formOptionD" required>
            </div>
            
            <div class="form-group">
                <label>正确答案 *</label>
                <select id="formCorrectAnswer" required>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>音频链接（可选）</label>
                <input type="text" id="formAudioUrl" placeholder="本地路径或外部链接">
            </div>
            
            <div class="form-group">
                <label>笔记（可选）</label>
                <textarea id="formNote" rows="3"></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="submit-btn">保存题目</button>
                <button type="button" class="cancel-btn" id="cancelAddBtn">取消</button>
            </div>
        </form>
    </div>
</div>

        <!-- 套题列表 -->
        <main class="sets-list" id="setsList">
            <!-- 动态生成 -->
        </main>

        <!-- 导出和同步按钮 -->
        <footer class="footer-actions">
            <button id="exportCSVBtn">导出CSV</button>
            <button id="exportJSONBtn">导出JSON</button>
            <button id="syncBtn">同步数据</button>
        </footer>
    </div>

    <!-- 题目详情弹窗 -->
    <div id="questionModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="questionDetail"></div>
        </div>
    </div>

    <!-- Supabase JS v2：浏览器直接连接 Supabase REST API -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth-gate.js"></script>
    <!-- 引入JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/question-manager.js"></script>
    <script src="js/audio-player.js"></script>
    <script src="js/note-manager.js"></script>
    <script src="js/search-engine.js"></script>
    <script src="js/export-manager.js"></script>
    <script src="js/sync-manager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
